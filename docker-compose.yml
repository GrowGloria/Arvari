# Запуск «Арвари» на своём сервере (Ubuntu + Docker).
#
#   docker compose up -d --build app
#
# Переменные берутся из файла .env рядом (см. deploy/.env.example).
# Наружу приложение выпускает Tailscale Funnel (+ Cloudflare Worker для
# красивого домена). Сам контейнер слушает только localhost.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ARVARI_PASSPHRASE=${ARVARI_PASSPHRASE}
      - ARVARI_SECRET=${ARVARI_SECRET}
      # Публичный адрес — для абсолютных ссылок/картинок в превью (OG).
      - ARVARI_PUBLIC_URL=${ARVARI_PUBLIC_URL}
    volumes:
      - arvari-data:/data
    # Только локально — в интернет пускает Tailscale Funnel, не порт наружу.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  arvari-data:
