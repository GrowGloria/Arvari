# Запуск «Арвари» на своём сервере (Ubuntu + Docker).
#
#   docker compose up -d --build
#
# Переменные берутся из файла .env рядом (см. deploy/.env.example).
# Публичный доступ даёт cloudflared — туннель до Cloudflare, без проброса портов.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ARVARI_PASSPHRASE=${ARVARI_PASSPHRASE}
      - ARVARI_SECRET=${ARVARI_SECRET}
    volumes:
      - arvari-data:/data
    # Локальная проверка на самом сервере: http://localhost:8080
    # (наружу не открыт — в интернет пускает только туннель).
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  arvari-data:
